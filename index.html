<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171923"><title>反射軌道</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{width:min(100%,520px);margin:auto;padding:0;position:relative}canvas{display:block;width:100%;aspect-ratio:8/9;background:transparent;touch-action:none} .floating{position:absolute;top:7px;right:7px;z-index:2;display:flex;gap:5px;align-items:flex-start}button,.file,summary{border:1px solid #737d91;border-radius:8px;background:#242b39e8;color:#fff;padding:8px 10px;font-size:12px;cursor:pointer}.file input{display:none}details{position:relative}details[open]{background:#202633f2;border-radius:8px;padding:0 6px 8px;max-width:300px;max-height:75vh;overflow:auto}details summary{list-style:none}details summary::-webkit-details-marker{display:none}.settings{display:flex;flex-direction:column;gap:7px;padding:9px 3px}.settings label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}.settings input[type=range]{width:135px;min-width:80px;accent-color:#00e5ff}.settings output{min-width:34px;text-align:right}.settings small{font-size:11px;color:#cbd0da}.settings .file{align-self:flex-start} .settings button{align-self:flex-start}
</style></head><body><main>
<canvas id="board" width="800" height="900"></canvas>
<div class="floating"><details id="settings"><summary>⚙ 調整</summary><div class="settings">
<label class="file">📷 スクショを選ぶ<input id="file" type="file" accept="image/*"></label>
<label>反射回数<input id="bounces" type="range" min="1" max="100" value="10"><output id="count">10</output></label>
<small>壁位置（オレンジ矢印先の薄い反射線を目安に調整）</small>
<label>左壁<input id="left" type="range" min="0" max="120" value="12"><output id="leftV">12</output></label>
<label>右壁<input id="right" type="range" min="0" max="120" value="12"><output id="rightV">12</output></label>
<label>上壁<input id="upper" type="range" min="0" max="120" value="12"><output id="upperV">12</output></label>
<label>下壁<input id="lower" type="range" min="0" max="120" value="12"><output id="lowerV">12</output></label>
<small>スクショの盤面切り出し</small>
<label>上端<input id="top" type="range" min="0" max="70" value="19" step="0.5"><output id="topV">19%</output></label>
<label>高さ<input id="height" type="range" min="20" max="85" value="50" step="0.5"><output id="heightV">50%</output></label>
<button id="clear" type="button">スクショ消去</button>
<button id="resetCrop" type="button">切り出し初期化</button>
</div></details></div>
</main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('board'),ctx=canvas.getContext('2d');
const W=800,H=900,EPS=1e-7,STEP=.35*Math.PI/180;
let origin={x:400,y:450},angle=-Math.PI/4,bounces=10,bg=null,drag=null,cropTop=19,cropHeight=50;
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function draw(){
 ctx.clearRect(0,0,W,H);
 if(bg){
  const portrait=bg.width/bg.height<.7;
  if(portrait){const sy=bg.height*cropTop/100,sh=Math.min(bg.height-sy,bg.height*cropHeight/100);ctx.drawImage(bg,0,sy,bg.width,sh,0,0,W,H)}
  else ctx.drawImage(bg,0,0,bg.width,bg.height,0,0,W,H);
 }
 const L=+$("left").value,R=W-+$("right").value,T=+$("upper").value,B=H-+$("lower").value;let x=clamp(origin.x,L,R),y=clamp(origin.y,T,B);
 let dx=Math.cos(angle),dy=Math.sin(angle);
 ctx.save();ctx.beginPath();ctx.rect(L,T,R-L,B-T);ctx.clip();
 ctx.beginPath();ctx.moveTo(x,y);
 for(let i=0;i<bounces;i++){
  const tx=dx>EPS?(R-x)/dx:dx<-EPS?(L-x)/dx:Infinity;
  const ty=dy>EPS?(B-y)/dy:dy<-EPS?(T-y)/dy:Infinity;
  const t=Math.min(tx>EPS?tx:Infinity,ty>EPS?ty:Infinity);
  if(!Number.isFinite(t))break;
  x=clamp(x+dx*t,L,R);y=clamp(y+dy*t,T,B);
  ctx.lineTo(x,y);
  if(Math.abs(tx-t)<1e-5)dx=-dx;
  if(Math.abs(ty-t)<1e-5)dy=-dy;
 }
 ctx.lineWidth=4;ctx.strokeStyle='#00e5ff';ctx.shadowColor='#00e5ff';ctx.shadowBlur=7;ctx.stroke();ctx.restore();
 ctx.lineWidth=2;ctx.strokeStyle='rgba(255,213,74,.35)';ctx.strokeRect(L,T,R-L,B-T);
 ctx.beginPath();ctx.arc(origin.x,origin.y,11,0,Math.PI*2);ctx.fillStyle='#ffd54a';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();
}
function point(e){const r=canvas.getBoundingClientRect();return{x:clamp((e.clientX-r.left)*W/r.width,+$("left").value,W-+$("right").value),y:clamp((e.clientY-r.top)*H/r.height,+$("upper").value,H-+$("lower").value)}}
function aim(p){if(Math.hypot(p.x-origin.x,p.y-origin.y)<5)return;angle=Math.round(Math.atan2(p.y-origin.y,p.x-origin.x)/STEP)*STEP;draw()}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const p=point(e);drag=Math.hypot(p.x-origin.x,p.y-origin.y)<35?'origin':'aim';canvas.setPointerCapture(e.pointerId);if(drag==='origin'){origin=p;draw()}else aim(p)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();const p=point(e);if(drag==='origin'){origin=p;draw()}else aim(p)});
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>drag=null);
$('bounces').addEventListener('input',e=>{bounces=+e.target.value;$('count').textContent=bounces+'回';draw()});
function load(file){if(!file||!file.type.startsWith('image/'))return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{bg=img;URL.revokeObjectURL(url);draw()};img.onerror=()=>{URL.revokeObjectURL(url);alert('画像を読み込めませんでした')};img.src=url}
$('file').addEventListener('change',e=>{load(e.target.files[0]);e.target.value='';$('settings').open=false });
document.addEventListener('paste',e=>{for(const item of e.clipboardData?.items||[]){if(item.type.startsWith('image/')){load(item.getAsFile());break}}});
$('clear').addEventListener('click',()=>{bg=null;draw()});
function updateCrop(){cropTop=+$('top').value;cropHeight=+$('height').value;$('topV').textContent=cropTop+'%';$('heightV').textContent=cropHeight+'%';draw()}
$('top').addEventListener('input',updateCrop);$('height').addEventListener('input',updateCrop);
for(const key of ['left','right','upper','lower'])$(key).addEventListener('input',e=>{$(key+'V').textContent=e.target.value;draw()});$('resetCrop').addEventListener('click',()=>{$('top').value=19;$('height').value=50;updateCrop()});
draw();
})();
</script></body></html>
