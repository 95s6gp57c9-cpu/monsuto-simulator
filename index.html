<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171923"><title>反射軌道</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171923;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{width:min(100%,520px);margin:auto;padding:8px}header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}h1{font-size:17px;margin:0}button,.file{background:#343b4d;border:1px solid #68738a;border-radius:9px;color:#fff;font-size:14px;padding:10px;cursor:pointer}.file input{display:none}.tools{display:flex;gap:7px;align-items:center}canvas{display:block;width:100%;aspect-ratio:8/9;background:#202633;touch-action:none;border:1px solid #697385;border-radius:8px}.control{display:flex;align-items:center;gap:10px;margin:12px 3px;font-size:14px}.control input{flex:1;min-width:0;accent-color:#00e5ff}.control output{width:40px;text-align:right}details{border-top:1px solid #444b5a;padding-top:8px;font-size:13px;color:#cbd0da}details summary{cursor:pointer}details label{display:flex;gap:8px;align-items:center;margin:10px 0}details input[type=range]{flex:1;min-width:0}small{color:#aab2c2}
</style></head><body><main><header><h1>反射軌道</h1><div class="tools"><label class="file">スクショを選ぶ<input id="file" type="file" accept="image/*"></label><button id="clear" type="button">消去</button></div></header>
<canvas id="board" width="800" height="900"></canvas>
<div class="control"><label for="bounces">反射回数</label><input id="bounces" type="range" min="1" max="100" value="10"><output id="count">10回</output></div>
<details><summary>スクショ位置を調整（必要な場合だけ）</summary><small>全画面スクショの盤面位置がずれたら調整してね。調整値はこのページを開いている間だけ保持されるよ。</small><label>上端 <input id="top" type="range" min="0" max="70" value="19" step="0.5"><span id="topV">19%</span></label><label>高さ <input id="height" type="range" min="20" max="85" value="50" step="0.5"><span id="heightV">50%</span></label><button id="resetCrop" type="button">切り出しを初期化</button></details>
</main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('board'),ctx=canvas.getContext('2d');
const W=800,H=900,EPS=1e-7,STEP=.35*Math.PI/180;
let origin={x:400,y:450},angle=-Math.PI/4,bounces=10,bg=null,drag=null,cropTop=19,cropHeight=50;
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#202633';ctx.fillRect(0,0,W,H);
 if(bg){
  const portrait=bg.width/bg.height<.7;
  if(portrait){const sy=bg.height*cropTop/100,sh=Math.min(bg.height-sy,bg.height*cropHeight/100);ctx.drawImage(bg,0,sy,bg.width,sh,0,0,W,H)}
  else ctx.drawImage(bg,0,0,bg.width,bg.height,0,0,W,H);
 }
 const margin=3;let x=clamp(origin.x,margin,W-margin),y=clamp(origin.y,margin,H-margin);
 let dx=Math.cos(angle),dy=Math.sin(angle);
 ctx.save();ctx.beginPath();ctx.rect(margin,margin,W-2*margin,H-2*margin);ctx.clip();
 ctx.beginPath();ctx.moveTo(x,y);
 for(let i=0;i<bounces;i++){
  const tx=dx>EPS?(W-margin-x)/dx:dx<-EPS?(margin-x)/dx:Infinity;
  const ty=dy>EPS?(H-margin-y)/dy:dy<-EPS?(margin-y)/dy:Infinity;
  const t=Math.min(tx>EPS?tx:Infinity,ty>EPS?ty:Infinity);
  if(!Number.isFinite(t))break;
  x=clamp(x+dx*t,margin,W-margin);y=clamp(y+dy*t,margin,H-margin);
  ctx.lineTo(x,y);
  if(Math.abs(tx-t)<1e-5)dx=-dx;
  if(Math.abs(ty-t)<1e-5)dy=-dy;
 }
 ctx.lineWidth=4;ctx.strokeStyle='#00e5ff';ctx.shadowColor='#00e5ff';ctx.shadowBlur=7;ctx.stroke();ctx.restore();
 ctx.lineWidth=3;ctx.strokeStyle='#ffd54a';ctx.strokeRect(margin,margin,W-2*margin,H-2*margin);
 ctx.beginPath();ctx.arc(origin.x,origin.y,11,0,Math.PI*2);ctx.fillStyle='#ffd54a';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();
}
function point(e){const r=canvas.getBoundingClientRect();return{x:clamp((e.clientX-r.left)*W/r.width,3,W-3),y:clamp((e.clientY-r.top)*H/r.height,3,H-3)}}
function aim(p){if(Math.hypot(p.x-origin.x,p.y-origin.y)<5)return;angle=Math.round(Math.atan2(p.y-origin.y,p.x-origin.x)/STEP)*STEP;draw()}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const p=point(e);drag=Math.hypot(p.x-origin.x,p.y-origin.y)<35?'origin':'aim';canvas.setPointerCapture(e.pointerId);if(drag==='origin'){origin=p;draw()}else aim(p)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();const p=point(e);if(drag==='origin'){origin=p;draw()}else aim(p)});
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>drag=null);
$('bounces').addEventListener('input',e=>{bounces=+e.target.value;$('count').textContent=bounces+'回';draw()});
function load(file){if(!file||!file.type.startsWith('image/'))return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{bg=img;URL.revokeObjectURL(url);draw()};img.onerror=()=>{URL.revokeObjectURL(url);alert('画像を読み込めませんでした')};img.src=url}
$('file').addEventListener('change',e=>{load(e.target.files[0]);e.target.value='' });
document.addEventListener('paste',e=>{for(const item of e.clipboardData?.items||[]){if(item.type.startsWith('image/')){load(item.getAsFile());break}}});
$('clear').addEventListener('click',()=>{bg=null;draw()});
function updateCrop(){cropTop=+$('top').value;cropHeight=+$('height').value;$('topV').textContent=cropTop+'%';$('heightV').textContent=cropHeight+'%';draw()}
$('top').addEventListener('input',updateCrop);$('height').addEventListener('input',updateCrop);
$('resetCrop').addEventListener('click',()=>{$('top').value=19;$('height').value=50;updateCrop()});
draw();
})();
</script></body></html>
